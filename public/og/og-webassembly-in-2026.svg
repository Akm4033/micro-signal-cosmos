<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Dark Radial & Linear Gradients -->
    <linearGradient id="bg-grad-og-webassembly-in-2026.svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17" />
      <stop offset="50%" stop-color="#070a10" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>
    <radialGradient id="glow-og-webassembly-in-2026.svg" cx="85%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#020408" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid-og-webassembly-in-2026.svg" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.45" />
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#bg-grad-og-webassembly-in-2026.svg)" />
  <rect width="1200" height="630" fill="url(#grid-og-webassembly-in-2026.svg)" />
  <rect width="1200" height="630" fill="url(#glow-og-webassembly-in-2026.svg)" />

  <!-- Accent Top Strip -->
  <rect x="0" y="0" width="1200" height="6" fill="#0ea5e9" />

  <!-- Category / Description Pill Badge -->
  <g transform="translate(80, 150)">
    <rect width="190" height="40" rx="20" fill="#0ea5e9" fill-opacity="0.12" stroke="#0ea5e9" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="24" cy="20" r="5" fill="#0ea5e9" />
    <text x="40" y="25" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#0ea5e9" letter-spacing="0.12em">TECHNOLOGY</text>
  </g>

  <!-- Title Section -->
  <g>
    <text x="80" y="275" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="#FFFFFF" letter-spacing="-0.03em">WebAssembly in 2026</text>
    
  </g>

  <!-- Divider Line -->
  <line x1="80" y1="480" x2="1120" y2="480" stroke="#1e293b" stroke-width="1.5" />

  <!-- Footer Branding -->
  <g transform="translate(80, 538)">
    <text x="0" y="0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">MICRO SIGNAL <tspan fill="#0ea5e9">COSMOS</tspan></text>
    <text x="0" y="26" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#94a3b8" letter-spacing="0.12em">DISCOVER MORE. UNDERSTAND BETTER.</text>

    <text x="1040" y="0" text-anchor="end" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Technical Publication</text>
    <text x="1040" y="26" text-anchor="end" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#64748b">https://microsignalcosmos.com</text>
  </g>
</svg>