<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Micro Signal Cosmos Brand Mark -->
  <!-- Dark Charcoal Tile Foundation -->
  <rect width="128" height="128" rx="28" fill="#0B1020"/>
  <rect x="1" y="1" width="126" height="126" rx="27" stroke="#38BDF8" stroke-opacity="0.2" stroke-width="2"/>

  <!-- Celestial Glow Backdrop -->
  <circle cx="64" cy="64" r="42" fill="#38BDF8" fill-opacity="0.08"/>

  <!-- Outer Cosmic Orbit -->
  <circle cx="64" cy="64" r="44" stroke="#38BDF8" stroke-width="4" stroke-opacity="0.75"/>

  <!-- Inner Discovery Orbit -->
  <circle cx="64" cy="64" r="30" stroke="#A78BFA" stroke-width="3.5" stroke-opacity="0.85"/>

  <!-- Radiating Signal Vectors -->
  <line x1="20" y1="64" x2="108" y2="64" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" stroke-opacity="0.5"/>
  <line x1="64" y1="20" x2="64" y2="108" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" stroke-opacity="0.5"/>
  <line x1="33" y1="33" x2="95" y2="95" stroke="#A78BFA" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.4"/>
  <line x1="95" y1="33" x2="33" y2="95" stroke="#A78BFA" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.4"/>

  <!-- Central Signal Core -->
  <circle cx="64" cy="64" r="14" fill="#38BDF8" fill-opacity="0.2" stroke="#38BDF8" stroke-width="3"/>
  <circle cx="64" cy="64" r="6" fill="#F0F9FF"/>

  <!-- Peripheral Signal Nodes -->
  <circle cx="64" cy="20" r="5" fill="#38BDF8"/>
  <circle cx="64" cy="108" r="5" fill="#A78BFA"/>
  <circle cx="20" cy="64" r="5" fill="#A78BFA"/>
  <circle cx="108" cy="64" r="5" fill="#38BDF8"/>
  <circle cx="33" cy="33" r="3.5" fill="#38BDF8"/>
  <circle cx="95" cy="95" r="3.5" fill="#A78BFA"/>
  <circle cx="95" cy="33" r="3.5" fill="#38BDF8"/>
  <circle cx="33" cy="95" r="3.5" fill="#A78BFA"/>
</svg>
