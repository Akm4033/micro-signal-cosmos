<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Signal Insight Brand Emblem: Knowledge Discovery & Global Exploration -->
  <defs>
    <linearGradient id="Signal Insight-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="beacon-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Deep Obsidian Tile -->
  <rect width="128" height="128" rx="28" fill="#090D16"/>
  <rect x="1.5" y="1.5" width="125" height="125" rx="26.5" stroke="#1d4ed8" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Radial Beacon Glow -->
  <circle cx="64" cy="64" r="46" fill="url(#beacon-glow)"/>

  <!-- Orbital Knowledge Ring (Stylized Open 'C' Arc) -->
  <path d="M 88 38 A 38 38 0 1 0 88 90" stroke="url(#Signal Insight-grad)" stroke-width="7" stroke-linecap="round"/>

  <!-- Internal Precision Vector Grid -->
  <line x1="26" y1="64" x2="102" y2="64" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" stroke-opacity="0.5"/>
  <line x1="64" y1="26" x2="64" y2="102" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" stroke-opacity="0.5"/>

  <!-- Dynamic Beacon Core -->
  <circle cx="64" cy="64" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
  <circle cx="64" cy="64" r="6" fill="#38bdf8"/>

  <!-- Knowledge Satellite Nodes -->
  <circle cx="88" cy="38" r="5" fill="#38bdf8"/>
  <circle cx="88" cy="90" r="5" fill="#a78bfa"/>
  <circle cx="26" cy="64" r="4" fill="#38bdf8"/>
  <circle cx="64" cy="26" r="4" fill="#60a5fa"/>
</svg>
